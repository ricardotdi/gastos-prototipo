<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastos — Protótipo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --ink:#12202E;
    --navy:#1A3C5E;
    --navy-deep:#0E2740;
    --gold:#A19276;
    --gold-soft:#C9BFA8;
    --paper:#F6F4EF;
    --line:#DAD4C6;
    --danger:#B4543A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding-bottom:90px;
  }
  header{
    background:linear-gradient(160deg,var(--navy) 0%,var(--navy-deep) 100%);
    color:#fff;
    padding:22px 20px 26px;
    border-radius:0 0 22px 22px;
  }
  header .eyebrow{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold-soft);
    margin-bottom:6px;
  }
  header h1{
    margin:0;
    font-size:15px;
    font-weight:600;
    opacity:.85;
  }
  .total-card{
    margin-top:14px;
  }
  .total-value{
    font-size:40px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    letter-spacing:-0.02em;
  }
  .total-label{
    font-size:12px;
    color:var(--gold-soft);
    margin-top:2px;
  }
  .month-nav{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:16px;
    font-size:13px;
    color:rgba(255,255,255,.7);
  }
  main{
    padding:18px 16px 0;
    max-width:480px;
    margin:0 auto;
  }
  .section-title{
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--navy);
    opacity:.6;
    margin:22px 2px 10px;
  }
  #chart-wrap{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
  }
  .entry{
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
  }
  .entry .meta{display:flex;flex-direction:column;gap:2px;}
  .entry .cat{
    font-size:12px;
    color:var(--navy);
    font-weight:600;
  }
  .entry .date{
    font-size:11px;
    color:#8a8478;
  }
  .entry .amount{
    font-size:16px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .entry button.del{
    background:none;
    border:none;
    color:#b8b0a0;
    font-size:16px;
    margin-left:10px;
    cursor:pointer;
  }
  .empty{
    text-align:center;
    padding:34px 10px;
    color:#8a8478;
    font-size:13px;
    border:1px dashed var(--line);
    border-radius:12px;
  }
  .fab{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    background:var(--gold);
    color:#fff;
    border:none;
    width:64px;
    height:64px;
    border-radius:50%;
    font-size:26px;
    box-shadow:0 8px 20px rgba(161,146,118,.45);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .fab:active{transform:translateX(-50%) scale(.94);}

  /* modal */
  .overlay{
    position:fixed;inset:0;
    background:rgba(14,39,64,.55);
    display:none;
    align-items:flex-end;
    z-index:50;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:#fff;
    width:100%;
    border-radius:20px 20px 0 0;
    padding:20px 18px 26px;
    max-height:88vh;
    overflow-y:auto;
  }
  .sheet h2{
    margin:0 0 4px;
    font-size:16px;
    color:var(--navy);
  }
  .sheet p.hint{
    margin:0 0 14px;
    font-size:12px;
    color:#8a8478;
  }
  #qr-reader{
    width:100%;
    border-radius:12px;
    overflow:hidden;
    background:#000;
  }
  .manual-toggle{
    text-align:center;
    margin-top:12px;
    font-size:12px;
    color:var(--navy);
    text-decoration:underline;
    cursor:pointer;
  }
  .form-row{margin-top:14px;}
  .form-row label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:#8a8478;
    margin-bottom:5px;
  }
  .form-row input, .form-row select{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:10px;
    font-size:15px;
    background:var(--paper);
  }
  .cats{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:6px;
  }
  .cat-chip{
    padding:7px 13px;
    border-radius:20px;
    border:1px solid var(--line);
    font-size:12.5px;
    background:#fff;
    cursor:pointer;
  }
  .cat-chip.active{
    background:var(--navy);
    color:#fff;
    border-color:var(--navy);
  }
  .confirm-btn{
    width:100%;
    margin-top:18px;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--navy);
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .close-btn{
    position:absolute;
    top:16px; right:16px;
    background:none;border:none;
    font-size:20px;color:#8a8478;
    cursor:pointer;
  }
  .sheet{position:relative;}
  .scan-status{
    font-size:12px;
    text-align:center;
    margin-top:10px;
    color:var(--navy);
    min-height:16px;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Protótipo · controlo pessoal</div>
  <h1>Os meus gastos</h1>
  <div class="total-card">
    <div class="total-value" id="totalMes">0,00 €</div>
    <div class="total-label" id="mesLabel">a carregar…</div>
  </div>
</header>

<main>
  <div id="chart-wrap">
    <canvas id="catChart" height="160"></canvas>
  </div>

  <div class="section-title">Movimentos recentes</div>
  <div id="lista"></div>
</main>

<button class="fab" id="openScan">＋</button>

<div class="overlay" id="overlay">
  <div class="sheet">
    <button class="close-btn" id="closeSheet">✕</button>
    <h2>Adicionar gasto</h2>
    <p class="hint">Aponta a câmara ao QR Code da fatura</p>

    <div id="qr-reader"></div>
    <div class="scan-status" id="scanStatus"></div>
    <div class="manual-toggle" id="manualToggle">ou inserir valor manualmente</div>

    <div id="manualFields" style="display:none">
      <div class="form-row">
        <label>Valor (€)</label>
        <input type="number" step="0.01" id="manualValor" placeholder="0,00">
      </div>
    </div>

    <div id="confirmFields" style="display:none">
      <div class="form-row">
        <label>Valor detetado</label>
        <input type="number" step="0.01" id="valorDetetado">
      </div>
      <div class="form-row">
        <label>Comerciante (opcional)</label>
        <input type="text" id="comercianteInput" placeholder="Nome da loja">
      </div>
      <div class="form-row">
        <label>Categoria</label>
        <div class="cats" id="catChips">
          <div class="cat-chip active" data-cat="Alimentação">Alimentação</div>
          <div class="cat-chip" data-cat="Casa">Casa</div>
          <div class="cat-chip" data-cat="Transporte">Transporte</div>
          <div class="cat-chip" data-cat="Saúde">Saúde</div>
          <div class="cat-chip" data-cat="Lazer">Lazer</div>
          <div class="cat-chip" data-cat="Outros">Outros</div>
        </div>
      </div>
      <button class="confirm-btn" id="confirmAdd">Adicionar</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'gastos_prototipo_v1';
let gastos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let html5QrCode = null;
let catAtiva = 'Alimentação';
let chart = null;

const overlay = document.getElementById('overlay');
const scanStatus = document.getElementById('scanStatus');
const confirmFields = document.getElementById('confirmFields');
const manualFields = document.getElementById('manualFields');

function salvar(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(gastos));
}

function mesAtualLabel(){
  const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const d = new Date();
  return meses[d.getMonth()] + ' ' + d.getFullYear();
}

function formatoEuro(v){
  return v.toLocaleString('pt-PT', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
}

function gastosDoMes(){
  const agora = new Date();
  return gastos.filter(g=>{
    const d = new Date(g.data);
    return d.getMonth() === agora.getMonth() && d.getFullYear() === agora.getFullYear();
  });
}

function render(){
  const doMes = gastosDoMes();
  const total = doMes.reduce((s,g)=>s+g.valor,0);
  document.getElementById('totalMes').textContent = formatoEuro(total);
  document.getElementById('mesLabel').textContent = 'gasto em ' + mesAtualLabel();

  const lista = document.getElementById('lista');
  const ordenado = [...gastos].sort((a,b)=> new Date(b.data) - new Date(a.data));
  if(ordenado.length === 0){
    lista.innerHTML = '<div class="empty">Ainda sem movimentos.<br>Toca em + para registar a primeira fatura.</div>';
  } else {
    lista.innerHTML = ordenado.slice(0,30).map(g=>{
      const d = new Date(g.data);
      const dataStr = d.toLocaleDateString('pt-PT',{day:'2-digit',month:'short'});
      return `<div class="entry">
        <div class="meta">
          <span class="cat">${g.categoria}${g.comerciante ? ' · '+g.comerciante : ''}</span>
          <span class="date">${dataStr}</span>
        </div>
        <div style="display:flex;align-items:center;">
          <span class="amount">${formatoEuro(g.valor)}</span>
          <button class="del" onclick="removerGasto(${g.id})">✕</button>
        </div>
      </div>`;
    }).join('');
  }

  renderChart(doMes);
}

function renderChart(doMes){
  const porCategoria = {};
  doMes.forEach(g=>{
    porCategoria[g.categoria] = (porCategoria[g.categoria] || 0) + g.valor;
  });
  const labels = Object.keys(porCategoria);
  const valores = Object.values(porCategoria);
  const ctx = document.getElementById('catChart');

  if(chart) chart.destroy();
  if(labels.length === 0){
    ctx.getContext('2d').clearRect(0,0,ctx.width,ctx.height);
    return;
  }
  chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: valores,
        backgroundColor: '#1A3C5E',
        borderRadius: 6,
        maxBarThickness: 34
      }]
    },
    options: {
      plugins: { legend: { display:false } },
      scales: {
        y: { beginAtZero:true, ticks:{ callback:v=>v+'€' } }
      }
    }
  });
}

window.removerGasto = function(id){
  gastos = gastos.filter(g=>g.id !== id);
  salvar();
  render();
};

// ---- Parsing do QR Code das faturas portuguesas ----
// Formato AT: campos separados por '*', cada campo "Letra:valor"
// O campo O = Total do documento com impostos (o que queremos)
function parseFaturaQR(texto){
  const campos = {};
  texto.split('*').forEach(par=>{
    const idx = par.indexOf(':');
    if(idx === -1) return;
    const chave = par.substring(0,idx).trim();
    const valor = par.substring(idx+1).trim();
    campos[chave] = valor;
  });

  const total = campos['O'] ? parseFloat(campos['O'].replace(',', '.')) : null;
  const nifEmitente = campos['A'] || null;

  return { total, nifEmitente, valido: total !== null && !isNaN(total) };
}

// ---- Scanner ----
document.getElementById('openScan').onclick = () => {
  overlay.classList.add('open');
  confirmFields.style.display = 'none';
  manualFields.style.display = 'none';
  scanStatus.textContent = '';
  iniciarScanner();
};

document.getElementById('closeSheet').onclick = () => {
  pararScanner();
  overlay.classList.remove('open');
};

document.getElementById('manualToggle').onclick = () => {
  pararScanner();
  document.getElementById('qr-reader').innerHTML = '';
  manualFields.style.display = 'block';
  confirmFields.style.display = 'block';
  document.getElementById('valorDetetado').value = '';
  document.getElementById('comercianteInput').value = '';
  scanStatus.textContent = '';
};

document.getElementById('manualValor').addEventListener('input', (e)=>{
  document.getElementById('valorDetetado').value = e.target.value;
});

document.querySelectorAll('.cat-chip').forEach(chip=>{
  chip.onclick = ()=>{
    document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    catAtiva = chip.dataset.cat;
  };
});

function iniciarScanner(){
  html5QrCode = new Html5Qrcode("qr-reader", {
    formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ],
    experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    verbose: false
  });
  scanStatus.textContent = 'A abrir câmara…';
  html5QrCode.start(
    { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } },
    { fps: 10, qrbox: 250, aspectRatio: 1.0 },
    (decodedText) => {
      const resultado = parseFaturaQR(decodedText);
      if(resultado.valido){
        pararScanner();
        document.getElementById('qr-reader').innerHTML = '';
        scanStatus.textContent = '✓ Fatura lida com sucesso';
        confirmFields.style.display = 'block';
        document.getElementById('valorDetetado').value = resultado.total.toFixed(2);
        document.getElementById('comercianteInput').value = '';
      } else {
        scanStatus.textContent = 'QR lido mas sem valor total reconhecido — tenta manual.';
      }
    },
    () => { /* erro de leitura por frame, ignorar */ }
  ).catch(err=>{
    scanStatus.textContent = 'Sem acesso à câmara. Usa a opção manual.';
    console.error(err);
  });
}

function pararScanner(){
  if(html5QrCode){
    html5QrCode.stop().catch(()=>{});
    html5QrCode = null;
  }
}

document.getElementById('confirmAdd').onclick = () => {
  const valor = parseFloat(document.getElementById('valorDetetado').value);
  if(isNaN(valor) || valor <= 0){
    alert('Introduz um valor válido.');
    return;
  }
  gastos.push({
    id: Date.now(),
    valor,
    categoria: catAtiva,
    comerciante: document.getElementById('comercianteInput').value.trim(),
    data: new Date().toISOString()
  });
  salvar();
  overlay.classList.remove('open');
  render();
};

render();
</script>
</body>
</html>
